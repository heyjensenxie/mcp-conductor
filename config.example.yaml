# MCP Conductor 配置示例。
# 复制为 config.yaml（或通过 CONDUCTOR_CONFIG 指定路径）后按需修改；
# 环境变量 CONDUCTOR_* 优先级更高。

server:
  host: 0.0.0.0
  port: 8080
  # 客户端 IP 解析：网关处于反向代理/网关之后时，列出可信代理（IP 或 CIDR），
  # 请求来自这些地址时才信任 X-Forwarded-For / X-Real-IP；留空（默认）只认直连地址。
  # trusted_proxies:
  #   - 10.0.0.0/8
  #   - 127.0.0.1

# driver 支持 memory（默认，无 MySQL 也可运行）| mysql（生产 MySQL 5.7+；DSN 需含 parseTime=true&loc=UTC&charset=utf8mb4）
database:
  driver: memory
  dsn: ""

redis:
  enabled: false
  addr: localhost:6379
  password: ""
  db: 0

gateway:
  upstream_timeout: 10s
  max_concurrency: 0 # 0 表示不限制

ratelimit:
  enabled: false
  # 数据面 /mcp 三级限流（仅 /mcp；/api 控制面与 Console 保持单维度默认）。
  # 采用「N 秒滑动窗口」：任意连续 window_seconds 秒内 ≤ 该级 QPS×window_seconds。
  #   - key 级：按 AccessKey 各自速率；0 → 沿用 qps。
  #   - IP 级：单来源 IP，ip_qps = 0 → 沿用 qps。
  #   - 全局级：整网关 /mcp 总闸，global_qps <= 0 → 不启用。
  qps: 20 # 维度默认每秒速率（查询型示例：20/s → 每分钟 ~1200 次）；代码默认 qps=0（不限流）
  burst: 10 # 已废弃（不再参与判定，保留兼容）
  window_seconds: 60 # 滑动窗口(秒,1..3600，默认 60=1 分钟)：任意 N 秒内 ≤ 该级 QPS×N
  # ip_qps: 100  # 单来源 IP：100/s → 每分钟 ~6000 次
  # ip_burst: 20
  # global_qps: 500 # 全局总闸：500/s → 每分钟 ~30000 次
  # global_burst: 100
  # 自动封禁：来源(IP / key)在检测窗口内被限流 429 达次数即临时封禁（TTL 自动解封，进程内）。
  # auto_ban:
  #   enabled: true
  #   window_seconds: 60
  #   max_violations: 5
  #   ban_seconds: 300

# 数据面治理的运行期种子：无后台保存值时生效；Console「防护」页保存后以保存值为准。
security:
  # 来源 IP/CIDR 封禁名单（仅数据面 /mcp；后台可动态增删并持久化）。
  ip_blocklist: []
  # ip_blocklist:
  #   - 203.0.113.9
  #   - 198.51.100.0/24
  # 可信豁免白名单：命中来源不受 IP 黑名单/自动封禁(IP)/单 IP 级限流影响。
  ip_whitelist: []
  # ip_whitelist:
  #   - 127.0.0.1
  #   - 10.0.0.0/8

# 认证（默认开启）：控制台需登录、/api 控制面需管理凭据。
#   - Console 登录：账号+密码（auth.admin_username / admin_password），默认 admin；
#   - /api 程序化/控制面：接受 operator_token 或登录会话；
#   - /mcp 数据面：接受数据面 API Key（api_keys / Console 创建），与登录分离。
# 以下凭据留空时，应用首启会自动生成并在启动日志打印一次：
#   admin_password（引导管理员密码）；token_secret/operator_token 内部自动补齐。
auth:
  enabled: true
  operator_token: ""
  # 数据面引导 key（subject:key，逗号分隔，可多个）：仅 /mcp，默认全量授权；
  # 不作为控制面凭据。留空则全部数据面 key 由 Console 在 /api 创建。
  api_keys: []
  # api_keys:
  #   - "client-a:dev-client-key"
  # 签发会话令牌的 HMAC 密钥（hex）；留空自动生成。
  token_secret: ""
  # Console 登录的管理员账号；admin_password 留空则首启生成并打印。
  admin_username: admin
  admin_password: ""
  # 登录会话有效期（留空默认 12h；单位小时，环境变量用 CONDUCTOR_AUTH_SESSION_TTL_MINUTES 指定分钟）。
  session_ttl: 12h

# Gateway→上游 凭证加密：AES-256 密钥（64 位 hex）。为空时 MySQL 存储拒绝
# 落库明文凭证值（仅 memory 模式可在进程内承载）。
credentials:
  encryption_key: ""

logging:
  level: info # debug | info | warn | error
  format: text

observability:
  # 捕获 tools/call 入参到调用日志（默认关，入参可能含隐私）。开启后 Traffic 行可
  # 「回放」——把捕获调用重发到其命中实例；响应**永不**落库。受 sample_rate 影响：
  # 被采样丢弃的行连同入参一并丢弃，无法回放。
  record_args: false
  sample_rate: 1.0           # 0-1 调用日志采样率
  # 分钟桶趋势（trend_minute）保留天数（1..365）：已闭合分钟每 60s 幂等落库，
  # 趋势跨重启可回溯；超过该天数由后台每小时清理。
  trend_retention_days: 7
# MCP Conductor 配置示例。
# 复制为 config.yaml（或通过 CONDUCTOR_CONFIG 指定路径）后按需修改；
# 环境变量 CONDUCTOR_* 优先级更高。

server:
  host: 0.0.0.0
  port: 8080

# driver 支持 memory（默认，无 MySQL 也可运行）| mysql（生产 MySQL 5.7+；DSN 需含 parseTime=true&loc=UTC&charset=utf8mb4）
database:
  driver: memory
  dsn: ""

redis:
  enabled: false
  addr: localhost:6379
  password: ""
  db: 0

gateway:
  upstream_timeout: 10s
  max_concurrency: 0 # 0 表示不限制

ratelimit:
  enabled: false
  qps: 100
  burst: 10

# 认证。关闭（默认）时一切开箱即用；开启后：
#   - /api 控制面：仅接受管理令牌 operator_token（或经登录换取的会话令牌）；
#   - /mcp 数据面：接受管理令牌与数据面 API Key（api_keys）。
auth:
  enabled: false
  # 控制面/Console 管理凭据；auth.enabled 时必须配置。在 Console“设置”页录入
  # 该令牌，或作为 password 调用 POST /api/auth/login 换取会话。
  operator_token: ""
  # 数据面引导 key（subject:key，逗号分隔，可多个）：仅 /mcp，默认全量授权；
  # 不作为控制面凭据。留空则全部数据面 key 由 Console 在 /api 创建。
  api_keys: []
  # api_keys:
  #   - "client-a:dev-client-key"
  # 签发会话令牌的 HMAC 密钥（32 位 hex）；auth.enabled 时必须配置。
  token_secret: ""

# Gateway→上游 凭证加密：AES-256 密钥（64 位 hex）。为空时 MySQL 存储拒绝
# 落库明文凭证值（仅 memory 模式可在进程内承载）。
credentials:
  encryption_key: ""

logging:
  level: info # debug | info | warn | error
  format: text

observability:
  record_body: false # 默认不记录 Tool 参数/返回值（可能含隐私）
  sample_rate: 1.0   # 0-1 调用日志采样率
# MCP Conductor 容器化运行（仅应用本身，不含基础设施）。
#
# 不再随编排启动 MySQL / Redis 容器：数据库与 Redis 使用宿主机已有实例。
# 容器内访问宿主机服务需用 host.docker.internal（Docker 20.10+；extra_hosts
# 提供 host-gateway 解析，Linux/WSL2/Desktop 均可用）。
#
# 连宿主机 MySQL / Redis 的账号密码不要写死在 yml，用环境变量覆盖：
#   CONDUCTOR_DB_USER / CONDUCTOR_DB_PASSWORD / CONDUCTOR_DB_HOST / CONDUCTOR_DB_PORT / CONDUCTOR_DB_NAME
#   CONDUCTOR_REDIS_HOST / CONDUCTOR_REDIS_PORT / CONDUCTOR_REDIS_PASSWORD
# 本机常见账号（示例，非默认密码）：
#   CONDUCTOR_DB_PASSWORD=123456 docker compose up -d --build
#
# 提示：Redis 仅当同时开启限流（CONDUCTOR_RATELIMIT_ENABLED=true）时才会连接
# 用于分布式 per-key 限流；本机 Redis 若只监听 127.0.0.1，需改为监听所有网卡
# 才能被容器访问。
services:
  conductor:
    build:
      context: .
      args:
        # 国内构建可改为 https://goproxy.cn,direct
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    ports:
      # host 侧映射用 CONDUCTOR_HTTP_PORT；容器内实际监听读 CONDUCTOR_SERVER_PORT。
      - "${CONDUCTOR_HTTP_PORT:-18110}:${CONDUCTOR_SERVER_PORT:-18110}"
    environment:
      # 容器内监听端口（与应用 config 的 server.port 对齐，默认 18110）。
      CONDUCTOR_SERVER_PORT: ${CONDUCTOR_SERVER_PORT:-18110}
      # 存储：默认连宿主机 MySQL；置 memory 可脱离数据库运行。
      CONDUCTOR_DATABASE_DRIVER: ${CONDUCTOR_DATABASE_DRIVER:-mysql}
      CONDUCTOR_DATABASE_DSN: "${CONDUCTOR_DB_USER:-root}:${CONDUCTOR_DB_PASSWORD:-}@tcp(${CONDUCTOR_DB_HOST:-host.docker.internal}:${CONDUCTOR_DB_PORT:-3306})/${CONDUCTOR_DB_NAME:-conductor}?parseTime=true&loc=UTC&charset=utf8mb4"
      # Redis：仅当 RATELIMIT_ENABLED=true 时才被连接用于分布式限流（默认关）。
      CONDUCTOR_REDIS_ENABLED: ${CONDUCTOR_REDIS_ENABLED:-false}
      CONDUCTOR_REDIS_ADDR: "${CONDUCTOR_REDIS_HOST:-host.docker.internal}:${CONDUCTOR_REDIS_PORT:-6379}"
      CONDUCTOR_REDIS_PASSWORD: ${CONDUCTOR_REDIS_PASSWORD:-}
      CONDUCTOR_RATELIMIT_ENABLED: ${CONDUCTOR_RATELIMIT_ENABLED:-false}
      CONDUCTOR_RATELIMIT_QPS: ${CONDUCTOR_RATELIMIT_QPS:-100}
      CONDUCTOR_AUTH_ENABLED: ${CONDUCTOR_AUTH_ENABLED:-true}
      CONDUCTOR_AUTH_OPERATOR_TOKEN: ${CONDUCTOR_AUTH_OPERATOR_TOKEN:-}
      CONDUCTOR_AUTH_TOKEN_SECRET: ${CONDUCTOR_AUTH_TOKEN_SECRET:-}
      CONDUCTOR_AUTH_ADMIN_USERNAME: ${CONDUCTOR_AUTH_ADMIN_USERNAME:-admin}
      CONDUCTOR_AUTH_ADMIN_PASSWORD: ${CONDUCTOR_AUTH_ADMIN_PASSWORD:-}
      CONDUCTOR_AUTH_API_KEYS: ${CONDUCTOR_AUTH_API_KEYS:-}
      CONDUCTOR_CREDENTIALS_ENCRYPTION_KEY: ${CONDUCTOR_CREDENTIALS_ENCRYPTION_KEY:-}
      CONDUCTOR_LOGGING_LEVEL: ${CONDUCTOR_LOGGING_LEVEL:-info}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

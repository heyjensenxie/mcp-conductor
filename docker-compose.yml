# MCP Conductor 一键本地部署：应用 + MySQL 5.7 + Redis。
#
# 应用配置唯一来源是项目根目录的 config.yaml（由 config.example.yaml 复制而来，
# 不跟踪密钥）：`cp config.example.yaml config.yaml` 后编辑，docker compose 会把
# 它挂载进 conductor 容器（CONDUCTOR_CONFIG=/app/config.yaml）。本地 `go run` 读的
# 也是同一份 config.yaml，两边配置一致、只维护一份。
#
# 内置 MySQL / Redis 仅在 Compose 内网可见，数据保存在命名卷；应用是否连它们由
# config.yaml 决定（用内置库时 database.dsn 指向 mysql:3306、redis 指向 redis:6379，
# 且密码需与下列默认凭据一致）。下列 ${VAR:-默认} 占位符在无 .env 时取默认值；
# 生产覆盖密钥请用 shell 环境变量 `MYSQL_ROOT_PASSWORD=xxx docker compose up`，
# 不要引入 .env 文件。MYSQL_USER 必须是普通账号，不能使用 root（官方镜像会拒绝启动）。
services:
  mysql:
    image: mysql:5.7
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mcp_conductor}
      MYSQL_USER: ${MYSQL_USER:-mcp_conductor}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-McpConductor#MySQL57!2026}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-McpConductor#RootMySQL57!2026}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${CONDUCTOR_REDIS_PASSWORD:-McpConductor#Redis7!2026}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${CONDUCTOR_REDIS_PASSWORD:-McpConductor#Redis7!2026}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  conductor:
    build:
      context: .
      args:
        # 国内构建可改为 https://goproxy.cn,direct
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    ports:
      # host 侧映射默认 18110（可用 CONDUCTOR_HTTP_PORT 覆盖）；容器内实际监听读
      # 挂载的 config.yaml server.port（默认 18110）。改 config.yaml 端口时需同步这里。
      - "${CONDUCTOR_HTTP_PORT:-18110}:18110"
    environment:
      # 应用读取挂载进容器的 config.yaml（其余 CONDUCTOR_* 不再逐项注入）。
      CONDUCTOR_CONFIG: /app/config.yaml
    volumes:
      # config.yaml 是唯一应用配置；宿主机没有该文件时先 cp config.example.yaml config.yaml。
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
